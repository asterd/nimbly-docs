name: Release

# Publishes a public, versioned build of the viewer bundle.
# Trigger by pushing a semver tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p release
          cp dist/nimbly-docs.*.min.js release/
          cp dist/nimbly-docs.*.min.js.map release/
          cp dist/nimbly-docs.*.min.js.sha384 release/
          bundle=$(basename $(ls dist/nimbly-docs.*.min.js | head -1))
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "sri=$(cat dist/*.sha384)" >> "$GITHUB_OUTPUT"
      # Publish the built bundle onto a dedicated `cdn` branch so it lives in the
      # git tree that jsDelivr's /gh/ endpoint can actually serve. dist/ is
      # gitignored on main, so the tag tree does not contain it — this branch does.
      - name: Publish bundle to cdn branch
        run: |
          version="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp -d)"
          cp dist/nimbly-docs.*.min.js "$tmp/"
          cp dist/nimbly-docs.*.min.js.map "$tmp/" || true
          cp dist/nimbly-docs.*.min.js.sha384 "$tmp/" || true
          # Stable, unhashed aliases for convenience.
          cp dist/nimbly-docs.min.js "$tmp/nimbly-docs.${version}.min.js"
          cp dist/nimbly-docs.min.js "$tmp/nimbly-docs.latest.min.js"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin cdn && git checkout cdn || git checkout --orphan cdn
          git rm -rfq . 2>/dev/null || true
          mkdir -p cdn
          cp "$tmp"/* cdn/
          echo "Nimbly Docs CDN branch — files are served via jsDelivr /gh/." > README.md
          git add -A
          git commit -m "cdn: ${GITHUB_REF_NAME}" || echo "no changes"
          git push origin cdn
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Nimbly Docs ${{ github.ref_name }}

            Public, pinned bundle for production use.

            **Bundle:** `${{ steps.artifacts.outputs.bundle }}`
            **SRI:** `${{ steps.artifacts.outputs.sri }}`

            ### Use it via jsDelivr (served from the `cdn` branch)

            ```html
            <script type="module"
              src="https://cdn.jsdelivr.net/gh/${{ github.repository }}@cdn/cdn/${{ steps.artifacts.outputs.bundle }}"
              crossorigin="anonymous"></script>
            ```

            ### Or via GitHub Pages (versioned)

            ```html
            <script type="module"
              src="https://${{ github.repository_owner }}.github.io/nimbly-docs/cdn/nimbly-docs.<version>.min.js"
              crossorigin="anonymous"></script>
            ```

            You can also download the attached bundle and host it yourself with
            `Cache-Control: public, max-age=31536000, immutable`.
